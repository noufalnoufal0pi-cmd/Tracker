<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOUFAL • Daily Activity Tracker</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#080808;
    color:white;
    min-height:100vh;
    padding:15px;
}

.container{
    max-width:1100px;
    margin:auto;
}

header{
    background:linear-gradient(145deg,#181818,#0d0d0d);
    border:1px solid #292929;
    border-radius:22px;
    padding:25px;
    margin-bottom:18px;
}

.logo{
    font-size:12px;
    letter-spacing:4px;
    color:#888;
    font-weight:bold;
}

h1{
    font-size:30px;
    margin-top:8px;
}

.subtitle{
    color:#777;
    margin-top:6px;
}

.date-box{
    margin-top:18px;
}

input[type="date"]{
    background:#111;
    color:white;
    border:1px solid #333;
    padding:11px;
    border-radius:10px;
}

.loading-banner{
    background:#161616;
    border:1px solid #292929;
    border-radius:14px;
    padding:12px 16px;
    margin-bottom:14px;
    color:#999;
    font-size:13px;
    display:none;
}

.loading-banner.show{
    display:block;
}

/* DASHBOARD */

.dashboard{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:18px;
}

.stat{
    background:#121212;
    border:1px solid #292929;
    border-radius:18px;
    padding:18px;
}

.stat-title{
    color:#777;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.stat-value{
    font-size:27px;
    font-weight:bold;
    margin-top:7px;
}

.progress{
    height:7px;
    background:#292929;
    border-radius:20px;
    overflow:hidden;
    margin-top:12px;
}

.progress-fill{
    height:100%;
    width:0%;
    background:white;
    transition:.3s;
}


/* SECTION */

.section{
    background:#111;
    border:1px solid #292929;
    border-radius:22px;
    padding:20px;
    margin-bottom:18px;
}

.section-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
}


/* ACTIVITY */

.routine{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.activity{
    display:grid;
    grid-template-columns:70px 1fr 110px;
    align-items:center;
    background:#171717;
    border:1px solid #242424;
    padding:12px;
    border-radius:14px;
}

.time{
    color:#888;
    font-size:12px;
    font-weight:bold;
}

.activity-name{
    font-weight:bold;
    font-size:14px;
}

.activity-detail{
    color:#777;
    font-size:11px;
    margin-top:4px;
}


/* ACTION BUTTONS */

.actions{
    display:flex;
    gap:6px;
    justify-content:flex-end;
}

.actions button{
    width:45px;
    height:38px;
    border-radius:9px;
    border:1px solid #333;
    background:#202020;
    color:#777;
    font-size:18px;
    cursor:pointer;
    transition:.2s;
}

.actions button:hover{
    transform:scale(1.06);
}

.actions button:disabled{
    opacity:.4;
    cursor:default;
    transform:none;
}


/* DONE */

.activity.done{
    border-color:#555;
}

.activity.done .done-btn{
    background:#fff;
    color:#000;
}

.activity.done .activity-name{
    text-decoration:line-through;
    opacity:.55;
}


/* MISSED */

.activity.missed{
    border-color:#555;
    opacity:.6;
}

.activity.missed .miss-btn{
    background:#555;
    color:white;
}

.activity.missed .activity-name{
    text-decoration:line-through;
}


/* MONTH */

.month-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:7px;
}

.day{
    background:#151515;
    border:1px solid #292929;
    border-radius:11px;
    padding:9px 4px;
    text-align:center;
    cursor:pointer;
}

.day-number{
    font-size:13px;
    font-weight:bold;
}

.day-percent{
    font-size:10px;
    color:#777;
    margin-top:4px;
}

.day.complete{
    border-color:#777;
    background:#222;
}

.day.today{
    box-shadow:0 0 0 1px white;
}


/* BUTTONS */

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
}

.main-btn{
    background:white;
    color:black;
    border:none;
    padding:11px 17px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.main-btn:disabled{
    opacity:.5;
    cursor:default;
}

.secondary{
    background:#1b1b1b;
    color:white;
    border:1px solid #333;
}


/* MOBILE */

@media(max-width:600px){

    body{
        padding:10px;
    }

    h1{
        font-size:24px;
    }

    .dashboard{
        grid-template-columns:1fr;
    }

    .activity{
        grid-template-columns:55px 1fr 100px;
        padding:10px 7px;
    }

    .activity-name{
        font-size:12px;
    }

    .activity-detail{
        font-size:9px;
    }

    .time{
        font-size:10px;
    }

    .actions button{
        width:42px;
        height:35px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>

    <div class="logo">
        NOUFAL • PERFORMANCE SYSTEM
    </div>

    <h1>Daily Activity Tracker</h1>

    <p class="subtitle">
        Build consistency. Track every day.
    </p>

    <div class="date-box">
        <input type="date" id="datePicker">
    </div>

</header>

<div class="loading-banner" id="loadingBanner">
    Loading your saved progress...
</div>

<!-- DASHBOARD -->

<div class="dashboard">

    <div class="stat">
        <div class="stat-title">
            Today's Progress
        </div>

        <div class="stat-value" id="todayPercent">
            0%
        </div>

        <div class="progress">
            <div class="progress-fill"
                 id="todayBar"></div>
        </div>
    </div>


    <div class="stat">
        <div class="stat-title">
            Monthly Average
        </div>

        <div class="stat-value" id="monthPercent">
            0%
        </div>

        <div class="progress">
            <div class="progress-fill"
                 id="monthBar"></div>
        </div>
    </div>


    <div class="stat">
        <div class="stat-title">
            Current Streak
        </div>

        <div class="stat-value" id="streak">
            0 Days
        </div>
    </div>

</div>


<!-- DAILY ROUTINE -->

<div class="section">

    <div class="section-title">
        ⏱️ Daily Routine
    </div>

    <div class="routine" id="routine"></div>

    <div class="buttons">

        <button class="main-btn" id="completeAllBtn"
                onclick="completeAll()">
            ✓ Complete All
        </button>

        <button class="main-btn secondary" id="resetTodayBtn"
                onclick="resetToday()">
            Reset Today
        </button>

    </div>

</div>


<!-- MONTHLY -->

<div class="section">

    <div class="section-title">
        📅 Monthly Tracker
    </div>

    <div class="month-grid"
         id="monthGrid"></div>

</div>


</div>


<script>

/* =========================
   ROUTINE
========================= */

const activities = [

    ["05:00","Wake Up","Start the day • Hydrate"],
    ["05:15","Morning Preparation","Freshen up • Prepare for the day"],
    ["05:30","Prayer / Quiet Time","Mental preparation"],
    ["06:00","Exercise","1 hour • Strength / Kabaddi training"],
    ["07:00","Cool Down","Stretching • Recovery"],
    ["07:30","Meal 1","Breakfast"],
    ["08:00","College / Daily Work","Focus session"],
    ["11:00","Meal 2","Lunch / Main meal"],
    ["13:00","Cycling","Cycling / Active movement"],
    ["14:00","Afternoon Nap","2 hours • Recovery"],
    ["16:00","Meal 3","Evening meal / snack"],
    ["17:00","Study","1 hour • Deep focus"],
    ["19:00","Meal 4","Dinner"],
    ["20:00","Light Activity","Walk • Mobility • Relax"],
    ["21:00","Prepare for Tomorrow","Plan tomorrow"],
    ["22:00","Sleep","Recovery • Consistent bedtime"]

];

const STORAGE_KEY = "routine-all-days";

/* In-memory cache of ALL days' data, shape: { "YYYY-MM-DD": [status,...] } */
let allData = {};
let dataLoaded = false;
let saveQueue = Promise.resolve();


/* =========================
   DATE
========================= */

const datePicker =
    document.getElementById("datePicker");

function todayString(){

    const d = new Date();

    return d.getFullYear()+"-"+

        String(d.getMonth()+1).padStart(2,"0")+"-"+

        String(d.getDate()).padStart(2,"0");
}

datePicker.value = todayString();


/* =========================
   STORAGE (persistent, replaces localStorage)

   Uses window.storage when available (inside a Claude
   artifact). Falls back to plain localStorage when this
   file is opened on its own — e.g. downloaded and run
   directly in a browser — where window.storage doesn't
   exist and would otherwise throw.
========================= */

const hasClaudeStorage =
    typeof window.storage !== "undefined" &&
    typeof window.storage.get === "function";

async function storageGet(key){

    if(hasClaudeStorage){
        return await window.storage.get(key, false);
    }

    const raw = localStorage.getItem(key);

    if(raw === null) return null;

    return { key, value: raw, shared: false };

}

async function storageSet(key,value){

    if(hasClaudeStorage){
        return await window.storage.set(key, value, false);
    }

    localStorage.setItem(key, value);

    return { key, value, shared: false };

}

async function loadAllData(){

    const banner = document.getElementById("loadingBanner");
    banner.classList.add("show");

    try{

        const result = await storageGet(STORAGE_KEY);

        if(result && result.value){
            allData = JSON.parse(result.value);
        }else{
            allData = {};
        }

    }catch(e){

        // Key doesn't exist yet, or fetch failed — start fresh.
        allData = {};

    }

    dataLoaded = true;
    banner.classList.remove("show");

}

function persistAllData(){

    // Queue saves so concurrent edits don't race each other.
    saveQueue = saveQueue.then(async ()=>{

        try{

            await storageSet(STORAGE_KEY, JSON.stringify(allData));

        }catch(e){

            console.error("Failed to save progress:", e);

        }

    });

    return saveQueue;

}

function getData(date){

    return allData[date] || [];

}

function saveData(date,data){

    allData[date] = data;

    persistAllData();

}


/* =========================
   RENDER DAY
========================= */

function renderDay(){

    const date = datePicker.value;

    const data = getData(date);

    const routine =
        document.getElementById("routine");

    routine.innerHTML = "";


    activities.forEach((activity,index)=>{

        const status = data[index] || 0;

        const div =
            document.createElement("div");

        div.className = "activity";

        if(status === 1)
            div.classList.add("done");

        if(status === 2)
            div.classList.add("missed");


        div.innerHTML = `

            <div class="time">
                ${activity[0]}
            </div>

            <div>

                <div class="activity-name">
                    ${activity[1]}
                </div>

                <div class="activity-detail">
                    ${activity[2]}
                </div>

            </div>


            <div class="actions">

                <button
                    class="done-btn"
                    onclick="setStatus(${index},1)"
                    title="Completed">

                    ✓

                </button>


                <button
                    class="miss-btn"
                    onclick="setStatus(${index},2)"
                    title="Missed">

                    ✕

                </button>

            </div>

        `;

        routine.appendChild(div);

    });

    updateStats();

}


/* =========================
   SET STATUS
========================= */

function setStatus(index,status){

    const date = datePicker.value;

    const data = getData(date).slice();

    // Ensure array is long enough
    while(data.length < activities.length) data.push(0);

    data[index] = status;

    saveData(date,data);

    renderDay();

    renderMonth();

}


/* =========================
   COMPLETE ALL
========================= */

function completeAll(){

    const date = datePicker.value;

    const data =
        activities.map(()=>1);

    saveData(date,data);

    renderDay();

    renderMonth();

}


/* =========================
   RESET
========================= */

function resetToday(){

    const date = datePicker.value;

    delete allData[date];

    persistAllData();

    renderDay();

    renderMonth();

}


/* =========================
   PERCENT
========================= */

function getPercent(date){

    const data = getData(date);

    let completed = 0;

    data.forEach(status=>{

        if(status === 1)
            completed++;

    });


    return Math.round(
        completed / activities.length * 100
    );

}


/* =========================
   STATS
========================= */

function updateStats(){

    const date = datePicker.value;

    const percent =
        getPercent(date);


    document.getElementById(
        "todayPercent"
    ).innerText = percent+"%";


    document.getElementById(
        "todayBar"
    ).style.width = percent+"%";


    const year =
        Number(date.substring(0,4));

    const month =
        Number(date.substring(5,7));


    const days =
        new Date(year,month,0).getDate();


    let total = 0;


    for(let d=1; d<=days; d++){

        const day =
            year+"-"+

            String(month).padStart(2,"0")+"-"+

            String(d).padStart(2,"0");


        total += getPercent(day);

    }


    const average =
        Math.round(total / days);


    document.getElementById(
        "monthPercent"
    ).innerText = average+"%";


    document.getElementById(
        "monthBar"
    ).style.width = average+"%";


    calculateStreak();

}


/* =========================
   STREAK
========================= */

function calculateStreak(){

    let streak = 0;

    let current = new Date();


    while(true){

        const date =
            current.getFullYear()+"-"+

            String(current.getMonth()+1)
            .padStart(2,"0")+"-"+

            String(current.getDate())
            .padStart(2,"0");


        if(getPercent(date) === 100){

            streak++;

            current.setDate(
                current.getDate()-1
            );

        }else{

            break;

        }

    }


    document.getElementById(
        "streak"
    ).innerText =
        streak+" Days";

}


/* =========================
   MONTH
========================= */

function renderMonth(){

    const grid =
        document.getElementById("monthGrid");

    grid.innerHTML = "";


    const date = datePicker.value;

    const year =
        Number(date.substring(0,4));

    const month =
        Number(date.substring(5,7));


    const days =
        new Date(year,month,0).getDate();


    for(let d=1; d<=days; d++){

        const day =
            year+"-"+

            String(month).padStart(2,"0")+"-"+

            String(d).padStart(2,"0");


        const percent =
            getPercent(day);


        const div =
            document.createElement("div");


        div.className = "day";


        if(percent === 100)
            div.classList.add("complete");


        if(day === todayString())
            div.classList.add("today");


        div.innerHTML = `

            <div class="day-number">
                ${d}
            </div>

            <div class="day-percent">
                ${percent}%
            </div>

        `;


        div.onclick = ()=>{

            datePicker.value = day;

            renderDay();

            renderMonth();

        };


        grid.appendChild(div);

    }

}


/* =========================
   DATE CHANGE
========================= */

datePicker.addEventListener(
    "change",
    ()=>{
        renderDay();
        renderMonth();
    }
);


/* =========================
   START
========================= */

async function init(){

    // Disable actions until data is loaded, so early clicks
    // don't overwrite the saved data with an empty default.
    document.getElementById("completeAllBtn").disabled = true;
    document.getElementById("resetTodayBtn").disabled = true;

    await loadAllData();

    document.getElementById("completeAllBtn").disabled = false;
    document.getElementById("resetTodayBtn").disabled = false;

    renderDay();
    renderMonth();

}

init();

</script>

</body>
</html>
