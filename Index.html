<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOUFAL | Daily Performance Tracker</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    color: white;
    min-height: 100vh;
    padding: 15px;

    background:
        radial-gradient(circle at 10% 10%, #302b63 0%, transparent 30%),
        radial-gradient(circle at 90% 20%, #ff512f 0%, transparent 25%),
        radial-gradient(circle at 50% 100%, #11998e 0%, transparent 30%),
        #080812;
}

.container {
    max-width: 950px;
    margin: auto;
}

/* ================= HEADER ================= */

header {
    text-align: center;
    padding: 20px 10px 30px;
}

.logo-container {
    display: flex;
    justify-content: center;
    margin-bottom: 18px;
}

.profile-logo {
    width: 110px;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    border-radius: 50%;

    border: 5px solid transparent;

    background:
        linear-gradient(#111, #111) padding-box,
        linear-gradient(
            135deg,
            #ff512f,
            #f09819,
            #ff00cc,
            #7b2cff,
            #00c6ff
        ) border-box;

    box-shadow:
        0 0 20px rgba(255, 81, 47, 0.45),
        0 0 45px rgba(123, 44, 255, 0.3);

    transition: 0.3s ease;
}

.profile-logo:hover {
    transform: scale(1.05);
}

.logo {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 6px;

    background: linear-gradient(
        90deg,
        #ff512f,
        #f09819,
        #ff00cc,
        #7b2cff,
        #00c6ff
    );

    -webkit-background-clip: text;
    color: transparent;
}

.subtitle {
    margin-top: 8px;
    color: #aaa;
    letter-spacing: 3px;
    font-size: 12px;
}

/* ================= DATE ================= */

.date-box {
    text-align: center;
    margin-bottom: 20px;
}

input[type="date"] {
    color: white;
    background: rgba(20, 20, 35, 0.9);
    border: 1px solid #444;
    border-radius: 12px;
    padding: 13px 18px;
    font-size: 15px;
    outline: none;
}

/* ================= PROGRESS ================= */

.progress-card {
    padding: 22px;
    margin-bottom: 20px;

    background: rgba(20, 20, 35, 0.85);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;

    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

.progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.progress-title {
    font-weight: bold;
    font-size: 16px;
}

.percent {
    font-size: 26px;
    font-weight: 900;

    background: linear-gradient(
        90deg,
        #00c6ff,
        #7b2cff,
        #ff00cc
    );

    -webkit-background-clip: text;
    color: transparent;
}

.progress-bar {
    height: 14px;
    background: #29293d;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;

    background: linear-gradient(
        90deg,
        #00c6ff,
        #7b2cff,
        #ff00cc,
        #ff512f
    );

    border-radius: 20px;
    transition: width 0.5s ease;
}

/* ================= ACTIVITY ================= */

.activity {
    margin-bottom: 13px;
    padding: 18px;

    background: rgba(20, 20, 35, 0.88);

    border: 1px solid rgba(255,255,255,0.08);
    border-left: 4px solid #7b2cff;

    border-radius: 17px;

    transition: 0.25s ease;
}

.activity:hover {
    transform: translateY(-2px);
    border-left-color: #ff00cc;
    box-shadow: 0 8px 25px rgba(123,44,255,0.15);
}

.activity-top {
    display: flex;
    align-items: center;
    gap: 15px;
}

.time {
    min-width: 135px;
    color: #aaa;
    font-size: 13px;
}

.task {
    flex: 1;
    font-size: 16px;
    font-weight: 700;
}

.buttons {
    display: flex;
    gap: 7px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 10px 13px;
    color: white;
    background: #29293d;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s ease;
}

button:hover {
    transform: scale(1.03);
}

/* Done */

.done.active {
    background: linear-gradient(
        135deg,
        #00b09b,
        #96c93d
    );

    box-shadow: 0 0 15px rgba(0, 200, 150, 0.3);
}

/* Not Done */

.failed.active {
    background: linear-gradient(
        135deg,
        #ff416c,
        #ff4b2b
    );

    box-shadow: 0 0 15px rgba(255, 65, 108, 0.3);
}

.status {
    margin-top: 10px;
    color: #888;
    font-size: 12px;
}

/* ================= MONTHLY ================= */

.month-title {
    margin: 32px 0 15px;
    font-size: 22px;

    background: linear-gradient(
        90deg,
        #00c6ff,
        #ff00cc
    );

    -webkit-background-clip: text;
    color: transparent;
}

.calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 7px;
}

.day-name {
    text-align: center;
    color: #888;
    font-size: 12px;
    padding: 7px;
}

.day {
    min-height: 62px;
    padding: 8px;

    text-align: center;

    background: rgba(20,20,35,0.85);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;

    cursor: pointer;
    transition: 0.2s ease;
}

.day:hover {
    transform: translateY(-2px);
    border-color: #7b2cff;
}

.day-number {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 6px;
}

.day-percent {
    font-size: 12px;
    color: #aaa;
}

/* Today's date */

.today {
    border: 2px solid #ff00cc;
    box-shadow: 0 0 12px rgba(255,0,204,0.2);
}

/* ================= RESET ================= */

.reset {
    width: 100%;
    margin-top: 22px;
    padding: 14px;

    background: linear-gradient(
        135deg,
        #ff416c,
        #ff4b2b
    );

    font-size: 15px;
}

.loading-note {
    text-align: center;
    color: #888;
    font-size: 13px;
    padding: 10px;
}

/* ================= MOBILE ================= */

@media (max-width: 650px) {

    body {
        padding: 9px;
    }

    .profile-logo {
        width: 90px;
        height: 90px;
        font-size: 36px;
    }

    .logo {
        font-size: 28px;
    }

    .activity-top {
        flex-direction: column;
        align-items: stretch;
    }

    .time {
        min-width: auto;
    }

    .buttons {
        width: 100%;
    }

    button {
        flex: 1;
    }

    .calendar {
        gap: 4px;
    }

    .day {
        min-height: 52px;
        padding: 5px;
    }
}
</style>

</div>

<div class="subtitle">
    DAILY PERFORMANCE SYSTEM
</div>
</header>

<div class="date-box">
<input type="date" id="datePicker">
</div>

<div class="progress-card">
<div class="progress-top">
    <div class="progress-title">🔥 Today's Completion</div>
    <div class="percent" id="totalPercent">0%</div>
</div>
<div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
</div>
</div>

<div id="loadingNote" class="loading-note">Loading your tracker…</div>
<div id="activities"></div>

<h2 class="month-title">📅 Monthly Progress</h2>
<div class="calendar" id="calendar"></div>

<button class="reset" onclick="resetDay()">🔄 Reset Today's Tracker</button>

</div>

<script>

/* =========================================
   YOUR DAILY ROUTINE
========================================= */

const routine = [
    ["5:00 AM – 5:30 AM", "🌅 Wake Up"],
    ["5:30 AM – 7:00 AM", "🔥 Workout"],
    ["7:00 AM – 8:00 AM", "🎒 Get Ready for College"],
    ["8:00 AM – 2:00 PM", "🎓 College"],
    ["2:00 PM – 2:30 PM", "🧘 Free / Travel / Freshen Up"],
    ["2:30 PM – 2:45 PM", "🍛 Lunch"],
    ["2:45 PM – 4:00 PM", "😴 Sleep"],
    ["4:00 PM – 5:00 PM", "🎮 Free Time"],
    ["5:00 PM – 6:00 PM", "📚 Study"],
    ["6:00 PM – 7:00 PM", "🚴 Cycling"],
    ["7:00 PM – 8:00 PM", "🍽️ Post Meal"],
    ["8:00 PM – 9:00 PM", "🥗 Dinner"],
    ["9:00 PM – 10:00 PM", "📋 Prepare for Tomorrow"]
];

const TOTAL = routine.length;

/* =========================================
   LOCAL STORAGE (all days in one key)
========================================= */

const STORAGE_KEY = "noufal_tracker_days";
let allData = {};

function loadAllData() {
    const saved = localStorage.getItem(STORAGE_KEY);
    allData = saved ? JSON.parse(saved) : {};
}

function persistAllData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
}

function getData(date) {
    return allData[date] || {};
}

/* =========================================
   DATE
========================================= */

const datePicker = document.getElementById("datePicker");

function getToday() {
    const date = new Date();
    return date.toISOString().split("T")[0];
}

datePicker.value = getToday();
datePicker.addEventListener("change", loadDay);

/* =========================================
   LOAD DAY
========================================= */

function loadDay() {
    const date = datePicker.value;
    const data = getData(date);
    const container = document.getElementById("activities");
    container.innerHTML = "";

    routine.forEach((item, index) => {
        const status = data[index] || "";

        const div = document.createElement("div");
        div.className = "activity";

        div.innerHTML = `
            <div class="activity-top">
                <div class="time">${item[0]}</div>
                <div class="task">${item[1]}</div>
                <div class="buttons">
                    <button class="done ${status === "done" ? "active" : ""}"
                        onclick="setStatus(${index}, 'done')">
                        ✓ Done
                    </button>
                    <button class="failed ${status === "failed" ? "active" : ""}"
                        onclick="setStatus(${index}, 'failed')">
                        ✕ Not Done
                    </button>
                </div>
            </div>
            <div class="status">
                Status: ${
                    status === "done" ? "✓ Completed" :
                    status === "failed" ? "✕ Not Completed" :
                    "○ Not Marked"
                }
            </div>
        `;

        container.appendChild(div);
    });

    updateProgress();
}

/* =========================================
   SET STATUS
========================================= */

function setStatus(index, status) {
    const date = datePicker.value;
    const data = getData(date);

    data[index] = status;
    allData[date] = data;

    persistAllData();

    loadDay();
    buildCalendar();
}

/* =========================================
   PROGRESS
========================================= */

function updateProgress() {
    const date = datePicker.value;
    const data = getData(date);

    let completed = 0;
    routine.forEach((_, index) => {
        if (data[index] === "done") completed++;
    });

    const percent = Math.round((completed / TOTAL) * 100);

    document.getElementById("totalPercent").textContent = percent + "%";
    document.getElementById("progressFill").style.width = percent + "%";
}

/* =========================================
   RESET DAY
========================================= */

function resetDay() {
    const date = datePicker.value;

    if (confirm("Reset this day's tracker?")) {
        delete allData[date];
        persistAllData();

        loadDay();
        buildCalendar();
    }
}

/* =========================================
   MONTHLY CALENDAR
========================================= */

function buildCalendar() {
    const calendar = document.getElementById("calendar");
    calendar.innerHTML = "";

    const selectedDate = new Date(datePicker.value);
    const year = selectedDate.getFullYear();
    const month = selectedDate.getMonth();

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const names = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    names.forEach(name => {
        const div = document.createElement("div");
        div.className = "day-name";
        div.textContent = name;
        calendar.appendChild(div);
    });

    for (let i = 0; i < firstDay; i++) {
        calendar.appendChild(document.createElement("div"));
    }

    for (let day = 1; day <= daysInMonth; day++) {
        const date = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const data = getData(date);

        let completed = 0;
        routine.forEach((_, index) => {
            if (data[index] === "done") completed++;
        });

        const percent = Math.round((completed / TOTAL) * 100);

        const div = document.createElement("div");
        div.className = "day";

        if (date === getToday()) {
            div.classList.add("today");
        }

        div.innerHTML = `
            <div class="day-number">${day}</div>
            <div class="day-percent">${percent}%</div>
        `;

        div.onclick = () => {
            datePicker.value = date;
            loadDay();
            window.scrollTo({ top: 0, behavior: "smooth" });
        };

        calendar.appendChild(div);
    }
}

/* =========================================
   START APP
========================================= */

function init() {
    loadAllData();
    document.getElementById("loadingNote").style.display = "none";
    loadDay();
    buildCalendar();
}

init();

</script>
</body>
</html>
